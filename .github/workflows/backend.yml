name: Backend verification
on:
  push:
    paths: ['Build&Hire.API/**', '.github/workflows/backend.yml', 'scripts/prepare-release.ps1']
  pull_request:
    paths: ['Build&Hire.API/**', '.github/workflows/backend.yml', 'scripts/prepare-release.ps1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integration
          POSTGRES_USER: integration
          # Disposable CI database only; no deployment credentials are used.
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=integration;Username=integration;Password=disposable-ci-only
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build, verify and prepare backend package
        shell: pwsh
        run: ./scripts/prepare-release.ps1 -PostgresEnvironment
